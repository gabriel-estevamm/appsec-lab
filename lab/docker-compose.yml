services:
  mysql:
    image: mysql:8.0
    container_name: appsec-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_db
      MYSQL_USER: appsec
      MYSQL_PASSWORD: appsec123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappsec", "-pappsec123"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: appsec-app
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  db_data:
